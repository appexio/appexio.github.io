<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Appexio — Admin Login</title>

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #07090e;
    --panel: #10141c;
    --border: rgba(255,255,255,.08);
    --text: #f5f7fb;
    --muted: #8e96a6;
    --primary: #7c5cff;
    --primary2: #5d7cff;
    --danger: #ff6574;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    font-family: "Inter", sans-serif;

    color: var(--text);

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(124,92,255,.18),
            transparent 40%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(93,124,255,.08),
            transparent 35%
        ),

        var(--bg);
}

.login-card {

    width: 100%;

    max-width: 410px;

    padding: 35px;

    border-radius: 22px;

    background: rgba(16,20,28,.94);

    border: 1px solid var(--border);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);

    backdrop-filter: blur(20px);
}

.logo-area {

    text-align: center;

    margin-bottom: 30px;
}

.logo {

    display: inline-flex;

    align-items: center;

    gap: 10px;

    font-size: 23px;

    font-weight: 800;
}

.logo-icon {

    width: 45px;

    height: 45px;

    display: grid;

    place-items: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    box-shadow:
        0 10px 30px
        rgba(124,92,255,.25);
}

.logo span {
    color: #a291ff;
}

.admin-badge {

    display: inline-block;

    margin-top: 11px;

    padding: 5px 9px;

    border-radius: 6px;

    color: #a999ff;

    background:
        rgba(124,92,255,.1);

    border:
        1px solid
        rgba(124,92,255,.18);

    font-size: 8px;

    font-weight: 700;

    letter-spacing: 1px;
}

.heading {

    text-align: center;

    margin-bottom: 25px;
}

.heading h1 {

    font-size: 20px;

    margin-bottom: 7px;
}

.heading p {

    color: var(--muted);

    font-size: 10px;

    line-height: 1.6;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {

    display: block;

    margin-bottom: 7px;

    color: #c9cdd6;

    font-size: 10px;

    font-weight: 600;
}

.input-wrapper {
    position: relative;
}

.input-wrapper > i {

    position: absolute;

    left: 13px;

    top: 50%;

    transform: translateY(-50%);

    color: #646c7b;

    font-size: 12px;

    pointer-events: none;
}

input {

    width: 100%;

    height: 46px;

    padding: 0 42px;

    outline: none;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: #0b0f16;

    color: white;

    font-size: 11px;

    transition: .2s;
}

input::placeholder {
    color: #555d6c;
}

input:focus {

    border-color:
        rgba(124,92,255,.6);

    box-shadow:
        0 0 0 3px
        rgba(124,92,255,.08);
}

.password-toggle {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    width: 30px;

    height: 30px;

    border: none;

    background: transparent;

    color: #626a79;

    cursor: pointer;
}

.password-toggle:hover {
    color: #a291ff;
}

.login-btn {

    width: 100%;

    height: 47px;

    margin-top: 7px;

    border: none;

    border-radius: 10px;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(124,92,255,.18);

    transition: .2s;
}

.login-btn:hover {

    transform: translateY(-1px);

    box-shadow:
        0 15px 35px
        rgba(124,92,255,.27);
}

.login-btn:disabled {

    opacity: .6;

    cursor: not-allowed;

    transform: none;
}

.error-message {

    display: none;

    margin-bottom: 15px;

    padding: 11px 12px;

    border-radius: 9px;

    color: #ff8c98;

    background:
        rgba(255,101,116,.07);

    border:
        1px solid
        rgba(255,101,116,.14);

    font-size: 9px;

    line-height: 1.5;
}

.error-message.show {
    display: block;
}

.success-message {

    display: none;

    margin-bottom: 15px;

    padding: 11px 12px;

    border-radius: 9px;

    color: #7ee2a8;

    background:
        rgba(55,190,110,.08);

    border:
        1px solid
        rgba(55,190,110,.15);

    font-size: 9px;

    line-height: 1.5;
}

.success-message.show {
    display: block;
}

.footer {

    margin-top: 25px;

    padding-top: 18px;

    border-top:
        1px solid var(--border);

    text-align: center;
}

.footer p {

    color: #555d6b;

    font-size: 8px;
}

.footer a {

    color: #8170d9;

    text-decoration: none;
}

.footer a:hover {
    color: #a291ff;
}

.spinner {

    display: inline-block;

    width: 13px;

    height: 13px;

    border:
        2px solid
        rgba(255,255,255,.3);

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin .7s linear infinite;

    vertical-align: middle;

    margin-right: 6px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

@media(max-width:450px) {

    .login-card {
        padding: 27px 20px;
    }

}

</style>

</head>


<body>


<div class="login-card">


    <div class="logo-area">

        <div class="logo">

            <div class="logo-icon">

                <i class="fa-brands fa-android"></i>

            </div>

            APP<span>EXIO</span>

        </div>

        <div class="admin-badge">
            ADMINISTRATOR
        </div>

    </div>


    <div class="heading">

        <h1>
            Welcome Back
        </h1>

        <p>
            Sign in to manage applications
            and Appexio content.
        </p>

    </div>


    <div
        class="error-message"
        id="errorMessage"
    ></div>


    <div
        class="success-message"
        id="successMessage"
    ></div>


    <form id="loginForm">


        <div class="form-group">

            <label for="email">
                Admin Email
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@example.com"
                    autocomplete="email"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Show password"
                >

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >

            <span id="loginText">

                <i class="fa-solid fa-right-to-bracket"></i>

                SIGN IN

            </span>

        </button>


    </form>


    <div class="footer">

        <p>

            Appexio Admin Panel ·

            <a href="../index.html">
                Back to website
            </a>

        </p>

    </div>


</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyABU60kwZik2S1_8Dx7sfT6HfGBIr935Bw",

    authDomain:
        "apkcity-30fa1.firebaseapp.com",

    projectId:
        "apkcity-30fa1",

    storageBucket:
        "apkcity-30fa1.firebasestorage.app",

    messagingSenderId:
        "965202080311",

    appId:
        "1:965202080311:web:6419bf702de3dcf024c5b2"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById(
        "loginForm"
    );

const email =
    document.getElementById(
        "email"
    );

const password =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const loginText =
    document.getElementById(
        "loginText"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );

const passwordToggle =
    document.getElementById(
        "passwordToggle"
    );


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

passwordToggle.addEventListener(
    "click",
    () => {

        if (
            password.type ===
            "password"
        ) {

            password.type =
                "text";

            passwordToggle.innerHTML =
                `<i class="fa-solid fa-eye-slash"></i>`;

            passwordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            password.type =
                "password";

            passwordToggle.innerHTML =
                `<i class="fa-solid fa-eye"></i>`;

            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        hideMessages();


        const emailValue =
            email.value.trim();

        const passwordValue =
            password.value;


        loginBtn.disabled =
            true;


        loginText.innerHTML = `

            <span class="spinner"></span>

            SIGNING IN...

        `;


        try {

            await signInWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );


            /*
             * IMPORTANT:
             *
             * Your admin dashboard is:
             *
             * ../admin.html
             *
             * because this login file is:
             *
             * /admin/login.html
             */

            showSuccess(
                "Login successful. Opening admin panel..."
            );


            setTimeout(
                () => {

                    window.location.href =
                        "../admin.html";

                },
                500
            );


        }

        catch (error) {

            console.error(
                "Firebase Authentication Error:",
                error
            );


            let message =
                "Unable to sign in.";


            switch (
                error.code
            ) {

                case "auth/invalid-credential":

                    message =
                        "Incorrect email or password.";

                    break;


                case "auth/invalid-email":

                    message =
                        "Please enter a valid email address.";

                    break;


                case "auth/user-disabled":

                    message =
                        "This admin account has been disabled.";

                    break;


                case "auth/too-many-requests":

                    message =
                        "Too many attempts. Please try again later.";

                    break;


                case "auth/network-request-failed":

                    message =
                        "Network error. Check your internet connection.";

                    break;


                default:

                    message =
                        "Login failed. Please check your credentials.";

            }


            showError(
                message
            );

        }


        finally {

            loginBtn.disabled =
                false;


            loginText.innerHTML = `

                <i class="fa-solid fa-right-to-bracket"></i>

                SIGN IN

            `;

        }

    }
);


/* =========================================
   ERROR
========================================= */

function showError(
    message
) {

    errorMessage.textContent =
        message;

    errorMessage.classList.add(
        "show"
    );

}


/* =========================================
   SUCCESS
========================================= */

function showSuccess(
    message
) {

    successMessage.textContent =
        message;

    successMessage.classList.add(
        "show"
    );

}


/* =========================================
   HIDE MESSAGES
========================================= */

function hideMessages() {

    errorMessage.classList.remove(
        "show"
    );

    successMessage.classList.remove(
        "show"
    );

}

</script>


</body>

</html>
