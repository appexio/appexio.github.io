<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Activation — Setup</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f5f7fb;
      position: relative;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url("https://appexio.github.io/favicon.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: min(62vw, 620px);
      opacity: .65;
      pointer-events: none;
    }
    main { max-width: 1280px; margin: 0 auto; padding: 48px 24px 64px; }
    .intro { text-align: center; margin-bottom: 42px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 4vw, 2.7rem); }
    .intro p { margin: 0 0 24px; color: #586174; }
    .download-button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 8px;
      background: #0067b8;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 5px 14px rgb(0 103 184 / 24%);
    }

    .brand {
  position: fixed;
  top: 18px;
  left: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
  color: #172033;
  z-index: 10;
}

.brand img {
  width: 36px;
  height: 36px;
  object-fit: contain;
}
    .download-button:hover, .download-button:focus { background: #005a9f; }
    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }
    .step {
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 16px rgb(20 35 60 / 10%);
    }
    .step h2 { margin: 0; padding: 15px 16px; font-size: 1.05rem; }
    .step a { display: block; color: inherit; text-decoration: none; }
    .step img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #e5e9f0;
    }
    .step a:focus-visible { outline: 3px solid #0067b8; outline-offset: -3px; }
    @media (max-width: 980px) { .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 620px) {
      main { padding: 32px 16px 48px; }
      .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .step h2 { padding: 12px; font-size: .95rem; }
    }
  </style>
</head>
<body>
<div class="brand">
  <img src="https://appexio.github.io/logo.png" alt="Appexio Devs logo">
  <span>Appexio Devs</span>
</div>
  <main>
    <section class="intro">
      <h1>Windows Activation Script (FREE)</h1>
      <h2>All in One - Activator</h2>
      <h3>1- Activate windows (permanent)
          2- Activate Office (Permanent)
          3- Check Activation...</h3>
      <p>Download Activation Setup, then follow the steps below.</p>
      <a class="download-button" href="https://appexio.github.io/Microsoft-Activation-Scripts-master.zip" target="_blank" rel="noopener noreferrer">Download Activation</a>
    </section>

    <section class="steps" aria-label="Office setup steps">
    <article class="step"><h2>Window Activation (VIDEO)</h2><a href="https://appexio.github.io/winvedio.mp4" target="_blank" rel="noopener noreferrer"><img src="https://appexio.github.io/i-img.png" alt="Window Activation Preview Video"></a></article>
      
    </section>
  </main>
</body>
</html>
